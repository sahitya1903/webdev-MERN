<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <h1>Course Registration Form</h1>
    <form action="./submit.html" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <label for="roll-no">Roll No:</label>
        <input type="number" id="roll-no" name="roll-no" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="phone">Mobile No:</label>
        <input type="number" id="phone" name="phone" maxlength="10" required>
        <br><br>
        <label for="course">Course:</label>
        <select type="text" id="course" name="course" required>
            <option value="">Select Course</option>
            <option value="cs">Computer Science</option>
            <option value="it">Information Technology</option>
        </select>
        <br><br>
        <label for="pass">Password:</label>
        <input type="password" id="pass" name="pass" minlength="8" required>
        <br><br>
        <label for="cpass">Confirm Password:</label>
        <input type="password" id="cpass" name="cpass" required>
        <br><br>
        <input type="checkbox" id="checkbox" name="checkbox" required>
        <label for="checkbox">I agree to the terms and conditions</label>
        <input type="submit" value="Register">
    </form>
    <br><br>
    <script src="./form.js"></script>
</body>
</html>
